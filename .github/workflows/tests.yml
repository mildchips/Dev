name: Offline tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  offline:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip check
      - name: Run synthetic tests with the socket guard
        shell: bash
        run: |
          set -euo pipefail
          unset AI_PROFIT_ALLOW_LIVE
          export AI_PROFIT_DB="$(mktemp -d "$RUNNER_TEMP/aipo-ci.XXXXXXXX")/finance.db"
          python scripts/test_offline.py -q
